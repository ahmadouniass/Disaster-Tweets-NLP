[tool.ruff]
# Longueur de ligne plus permissive pour la Data Science / Web
line-length = 120

[tool.ruff.lint]
# Règles à activer
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Dans les notebooks et utilitaires, on est plus souple sur tout
"*.ipynb" = ["E402", "F401", "F841", "E501"]
"notebooks/models_training/*.py" = ["E402", "F401", "F841", "E501"]
"notebooks/EDA/*.ipynb" = ["E402", "E501"]

# Dans les apps web, on ignore les lignes longues (cause HTML injecté)
"**/web_app/*.py" = ["E501"]
"**/web application/*.py" = ["E501"]
"**/app.py" = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2