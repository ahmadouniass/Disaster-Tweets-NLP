name: Python CI

on:
  push:
    branches: [ "main", "fix/deployment" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      run: |
        # On vérifie la qualité du code (erreurs, style, imports inutilisés)
        ruff check .

    - name: Test with pytest
      run: |
        # On lance les tests unitaires
        # On ignore le téléchargement LFS pour gagner du temps/quota en CI
        pytest
